name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Set VITE_BASE to repository name path, e.g. '/repo-name/'
          VITE_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build

      - name: Setup Pages
        # Configure Pages (creates pages environment and required setup)
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        # Use current stable upload-pages-artifact (v3) to avoid deprecated internal upload-artifact v3
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        # Use a compatible deploy-pages version (v5) which works with upload-pages-artifact@v3
        uses: actions/deploy-pages@v5
